# Turns whatever anyone uploaded into media their trip site can show.
# Runs on a timer, and can be started by hand from the Actions tab.
# Nothing is committed: each trip's photo list is written next to its photos,
# so a new upload never rebuilds the site.
name: ingest uploads

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick
          pip install -q -r pipeline/requirements.txt

      - name: ingest
        run: python pipeline/ingest.py

      # The models are ~100 MB and never change, so they are fetched once and
      # kept. Without them the face step simply does nothing and says so.
      - name: face models
        id: models
        uses: actions/cache@v4
        with:
          path: /tmp/face_models
          key: face-models-v1

      - name: fetch face models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/face_models && cd /tmp/face_models
          for f in shape_predictor_68_face_landmarks \
                   dlib_face_recognition_resnet_model_v1 \
                   mmod_human_face_detector; do
            curl -sSL -o "$f.dat.bz2" "http://dlib.net/files/$f.dat.bz2"
            bunzip2 -f "$f.dat.bz2"
          done

      # Groups the faces in each trip so the owner can name them once, and
      # applies the names already given. Never fails the run: the photos are
      # already on the site by this point.
      - name: who is in the photos
        continue-on-error: true
        run: python pipeline/facescan.py

      - name: tidy
        if: always()
        run: rm -rf _work
